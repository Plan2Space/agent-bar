name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # A UI e Windows-only (CIM/PowerShell, Win32). Os testes de GUI rodam com Qt offscreen.
    # Nome do job e matriz NAO mudam: a protecao do main exige "test (3.11)" e "test (3.12)".
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # H-012: dependencias travadas no uv.lock; CI nao muda sem commit. Lock desatualizado reprova aqui.
      - name: Lock is current
        run: uv lock --check
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
        timeout-minutes: 15
