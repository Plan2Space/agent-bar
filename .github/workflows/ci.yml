name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]                  # edited: colar o bloco do gate re-roda o check

permissions:
  contents: read

jobs:
  test:
    # A UI e Windows-only (CIM/PowerShell, Win32). Os testes de GUI rodam com Qt offscreen.
    # Nome do job e matriz NAO mudam: a protecao do main exige "test (3.11)" e "test (3.12)".
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                                            # o review-gate compara base...head
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # H-012: dependencias travadas no uv.lock; CI nao muda sem commit. Lock desatualizado reprova aqui.
      - name: Lock is current
        run: uv lock --check
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
        timeout-minutes: 15
      # H-013: PR que toca a Revisao visual traz o resultado dos testes com o evidence REAL (privado), travado no HEAD
      - name: Review gate (evidence real, local)
        if: github.event_name == 'pull_request'
        run: uv run python -m agent_bar.review_gate check-pr
