[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bar"
version = "0.1.0"
description = "Agent Bar: barra do Windows que observa Claude Code, Codex, GPT, o laco de revisao, o GitHub e o EventStore do agent-runtime (somente leitura)"
requires-python = ">=3.11"
# risco, aprovacao C9 e decisao de merge vem do runtime (S00-14), fixado por SHA completo (agent-runtime main apos PR #65; aprovadores por nivel desde o PR #64)
dependencies = ["agent-runtime @ git+https://github.com/Plan2Space/agent-runtime@708eadf5c16a3f4ab452251e849d27d9e045d640"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7,<7.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.6", "PySide6-Essentials>=6.7,<7.0"]

[tool.setuptools.packages.find]
include = ["agent_bar*"]

[tool.setuptools.package-data]
"agent_bar.platform" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# agente/provedor REAL custa tokens e depende da maquina: so roda com `-m real_agent` explicito (o -m da linha de
# comando substitui este), nunca no CI de PR
addopts = "-m 'not real_agent and not local_env and not real_network and not real_github'"
# teste travado (> 4 min) despeja a pilha de TODAS as threads no log: o CI mata o job aos 15 min sem dizer onde
faulthandler_timeout = 240
markers = ["real_agent: usa provedor real (Claude, Codex, Ollama); opt-in com -m real_agent",
           "local_env: confere o ambiente desta maquina (o .venv do atalho); opt-in com -m local_env, fora do CI",
           "real_network: usa a rede de verdade (fora do loopback); opt-in, fora do CI (tests/conftest.py)",
           "real_github: executa o gh de verdade e gasta cota da API; opt-in, fora do CI (tests/conftest.py)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv", "runs", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F811"]
