[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bar"
version = "0.1.0"
description = "Agent Bar: barra do Windows que observa Claude Code, Codex, GPT, o laco de revisao, o GitHub e o EventStore do agent-runtime (somente leitura)"
requires-python = ">=3.11"
# risco, aprovacao C9 e decisao de merge vem do runtime (S00-14), fixado por SHA completo (agent-runtime main, PR #60)
dependencies = ["agent-runtime @ git+https://github.com/Plan2Space/agent-runtime@92acdcdd8cd8dd6a69152c79f5bd304280733235"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7,<7.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.6", "PySide6-Essentials>=6.7,<7.0"]

[tool.setuptools.packages.find]
include = ["agent_bar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv", "runs", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F811"]
